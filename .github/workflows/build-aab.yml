Build AAB from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          unzip -o "$ZIPFILE"
          rm -f "$ZIPFILE"
          if [ ! -f "package.json" ]; then
            FOUND=$(find . -name "package.json" | head -n 1)
            DIR=$(dirname "$FOUND")
            cp -r $DIR/* . || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fix npm and install
        run: |
          npm cache clean --force
          rm -rf package-lock.json node_modules
          npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Indori-Festival-App-AAB
          path: android/app/build/outputs/bundle/release/*.aab from ZIP
