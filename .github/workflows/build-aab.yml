name: Build AAB from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIPFILE"
          unzip -o "$ZIPFILE"
          rm -f "$ZIPFILE"
          ls -la
          # If zip made a single folder, bring files out
          if [ -f "package.json" ]; then
            echo "package.json found in root"
          else
            echo "Searching for package.json"
            FOUND=$(find . -name "package.json" -type f | head -n 1)
            echo "Found at: $FOUND"
            if [ ! -z "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "Moving files from $DIR"
              cp -r $DIR/* . || true
              cp -r $DIR/.* . 2>/dev/null || true
            fi
          fi
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Indori-Festival-App-AAB
          path: android/app/build/outputs/bundle/release/*.aab
